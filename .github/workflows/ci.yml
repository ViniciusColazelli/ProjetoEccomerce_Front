# Verificações que precisam passar antes do merge na main.
# Marque os jobs como obrigatórios em Settings → Branches → regra de proteção da main.
# O deploy continua com a Vercel: o CI só confere, não publica nada.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# um commit novo no mesmo PR cancela a execução anterior, que já ficou desatualizada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mesmo comando da Vercel no deploy: se uma página ou o proxy.js quebrarem, o erro aparece aqui.
    # Sem API_URL o rewrite do /backend aponta para o localhost, o que não importa para o build
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      # versão do .nvmrc (lts/krypton = Node 24, a mesma do "engines" que a Vercel segue)
      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Compila
        run: npm run build

  formatacao:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala as dependências
        run: npm ci

      # Falha se algum arquivo não estiver como o Prettier deixaria.
      # Para corrigir na sua máquina: npm run lint:fix
      - name: Confere a formatação
        run: npm run lint:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala as dependências
        run: npm ci

      # Regras do Next e dos hooks do React (eslint.config.mjs). Falha com qualquer erro ou aviso.
      # Para ver na sua máquina: npm run eslint
      - name: Confere o código com o ESLint
        run: npm run eslint

  pacotes-vulneraveis:
    name: Pacotes vulneráveis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Compara o package-lock.json (inclusive as dependências das dependências) com o banco
      # de vulnerabilidades do npm e falha com qualquer uma, de qualquer gravidade.
      # Para corrigir: npm audit fix (ou atualizar o pacote direto no package.json)
      - name: Procura pacotes com vulnerabilidade conhecida
        run: npm audit --audit-level=low

  segredos:
    name: Segredos no código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # histórico inteiro: um segredo commitado e apagado no commit seguinte continua público no Git
      - name: Baixa o código com todo o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Procura senhas, chaves e tokens em todos os commits; --redact esconde os valores no log.
      # Se um achado for falso positivo, adicione a impressão digital dele num .gitleaksignore
      - name: Procura segredos com o gitleaks
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo
          --redact
          --verbose
          --no-banner
